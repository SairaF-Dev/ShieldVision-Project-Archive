# Parameters
nc: 1  # number of classes
scales:
  n: [0.50, 0.25, 1024]  # depth, width, max_channels

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2 (c2=256, c3k=False, e=0.25)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4 (c2=512, c3k=False, e=0.25)
  - [-1, 1, CBAM, [128]]         # 5 (P3 level)
  - [-1, 1, Conv, [512, 3, 2]]  # 6-P4/16
  - [-1, 2, C3k2, [512, True]]   # 7 (c2=512, c3k=True) - uses C3k blocks
  - [-1, 1, CBAM, [128]]         # 8 (P4 level)
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]  # 10 (c2=1024, c3k=True) - uses C3k blocks
  - [-1, 1, SPPF, [1024, 5]]    # 11
  - [-1, 2, C2PSA, [1024]]      # 12
  - [-1, 1, CBAM, [256]]        # 13 (P5 level)

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 8], 1, Concat, [1]]  # 15 (concat with layer 8)
  - [-1, 2, C3k2, [512, False]] # 16 (c2=512, c3k=False)
  - [-1, 1, CBAM, [128]]        # 17
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 4], 1, Concat, [1]]  # 19 (concat with layer 4)
  - [-1, 2, C3k2, [256, False]] # 20 (c2=256, c3k=False)
  
  - [-1, 1, Conv, [256, 3, 2]]  # 21
  - [[-1, 16], 1, Concat, [1]]  # 22 (concat with layer 16)
  - [-1, 2, C3k2, [512, False]] # 23 (c2=512, c3k=False)
  
  - [-1, 1, Conv, [512, 3, 2]]  # 24
  - [[-1, 13], 1, Concat, [1]]  # 25 (concat with layer 13)
  - [-1, 2, C3k2, [1024, True]] # 26 (c2=1024, c3k=True) - uses C3k blocks
  
  - [[20, 23, 26], 1, Detect, [nc]]  # 27 (Detect layers on 20-P3, 23-P4, 26-P5)





